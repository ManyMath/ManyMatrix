[package]
name = "manymatrix-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Rust core client library for Matrix, auth, sync, rooms, messaging, E2EE, media"
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
url.workspace = true
thiserror = "1"
mime = "0.3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
matrix-sdk = { version = "0.16.0", default-features = false, features = [
    "bundled-sqlite",
    "markdown",
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "sqlite",
    "rustls-tls",
] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_family = "wasm")'.dependencies]
matrix-sdk = { version = "0.16.0", default-features = false, features = [
    "indexeddb",
    "js",
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "markdown",
    "rustls-tls",
] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
