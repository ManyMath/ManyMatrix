[package]
name = "manymatrix-web"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "wasm-bindgen glue crate for the ManyMatrix Flutter web/extension bridge (not a standalone library)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.67"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
manymatrix-core = { path = "../core", version = "0.2.0" }
futures-util = "0.3"
base64 = "0.22"

[package.metadata.wasm-pack.profile.release]
# The workspace's [profile.release] LTO now lets rustc lower large memcpys to
# wasm bulk-memory ops (memory.copy) on wasm32-unknown-unknown; the wasm-opt
# binary bundled with wasm-pack rejects those unless bulk memory is enabled.
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
