[package]
name = "manymatrix-web"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "wasm-bindgen glue crate for the ManyMatrix Flutter web/extension bridge (not a standalone library)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.67"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
manymatrix-core = { path = "../core", version = "0.2.0" }
futures-util = "0.3"
base64 = "0.22"
