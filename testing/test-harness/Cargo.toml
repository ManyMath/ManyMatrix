[package]
name = "test-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["embedded-tests"]
embedded-tests = ["dep:tuwunel-embed"]
docker-tests = ["dep:testcontainers"]
shadow-tests = ["dep:serde_yaml", "dep:toml", "dep:shadow-common"]
hosted-tests = []
[dependencies]
manymatrix-core = { path = "../../crates/core" }
manymatrix-ffi = { path = "../../crates/ffi" }
matrix-sdk = { version = "0.16.0", default-features = false, features = [
    "bundled-sqlite",
    "markdown",
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "sqlite",
    "rustls-tls",
] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
testcontainers = { version = "0.23", features = ["http_wait"], optional = true }
tuwunel-embed = { git = "https://github.com/sneurlax/tuwunel", rev = "3c69fdd5", optional = true }
reqwest = { workspace = true, features = ["json"] }
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
tempfile = "3"
futures-util = "0.3"
paste = "1"
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
shadow-common = { path = "../shadow-common", optional = true }
