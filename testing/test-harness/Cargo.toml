[package]
name = "test-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["embedded-tests"]
embedded-tests = ["dep:tuwunel-embed"]
docker-tests = ["dep:testcontainers"]
shadow-tests = ["dep:serde_yaml", "dep:toml"]
[dependencies]
manymatrix-core = { path = "../../crates/core" }
manymatrix-ffi = { path = "../../crates/ffi" }
matrix-sdk.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
testcontainers = { version = "0.21", features = ["http_wait"], optional = true }
tuwunel-embed = { git = "https://github.com/sneurlax/tuwunel", rev = "3c69fdd5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
tempfile = "3"
futures-util = "0.3"
paste = "1"
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
