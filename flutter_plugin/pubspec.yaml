name: manymatrix
description: "Rust core library for Matrix clients, tested end-to-end against real homeservers, wrapped in a Dart/Flutter plugin."
homepage: "https://github.com/sneurlax/manymatrix"
repository: "https://github.com/sneurlax/manymatrix"
issue_tracker: "https://github.com/sneurlax/manymatrix/issues"
topics:
  - matrix
  - chat
  - e2ee
  - ffi
publish_to: 'none'
resolution: workspace

version: 1.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.0.0
  json_annotation: ^4.8.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^11.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
