[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/ffi",
    "crates/web",
    "testing/test-harness",
    "testing/shadow-common",
    "testing/shadow-client",
]
exclude = ["testing/tuwunel"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80.0"
version = "0.1.0"
authors = ["sneurlax"]
homepage = "https://github.com/sneurlax/manymatrix"
repository = "https://github.com/sneurlax/manymatrix"
description = "Rust core library for Matrix clients, tested end-to-end against real homeservers, wrapped in a Dart/Flutter plugin"
keywords = ["matrix", "chat", "e2ee", "flutter", "ffi"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "=0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[profile.release]
panic = "unwind"

[profile.shadow]
inherits = "release"
strip = "symbols"
debug = false

[patch.crates-io.core_affinity]
git = "https://github.com/matrix-construct/core_affinity_rs"
rev = "ff148c2985cbaff3e6e953d45cda4d7696f38d75"

[patch.crates-io.event-listener]
path = "vendor/event-listener-5.4.1"

[patch.crates-io.async-channel]
path = "vendor/async-channel-2.5.0"

[patch.crates-io.ruma-client-api]
path = "vendor/ruma-client-api-0.22.0"

[patch."https://github.com/sneurlax/tuwunel"]
tuwunel-embed = { path = "testing/tuwunel/src/embed" }
tuwunel = { path = "testing/tuwunel/src/main" }
tuwunel_core = { path = "testing/tuwunel/src/core" }
tuwunel_admin = { path = "testing/tuwunel/src/admin" }
tuwunel_database = { path = "testing/tuwunel/src/database" }
tuwunel_macros = { path = "testing/tuwunel/src/macros" }
tuwunel_service = { path = "testing/tuwunel/src/service" }
tuwunel_api = { path = "testing/tuwunel/src/api" }
tuwunel_router = { path = "testing/tuwunel/src/router" }
