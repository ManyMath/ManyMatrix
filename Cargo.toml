[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/ffi",
    "testing/test-harness",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
matrix-sdk = { version = "0.7", default-features = false, features = [
    "bundled-sqlite",
    "markdown",
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "sqlite",
    "rustls-tls",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "=0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
