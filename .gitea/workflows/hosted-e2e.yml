name: Hosted E2E

# Runs on the manytier-ci act_runner on the same Hetzner box as the hosted
# homeservers (near-zero latency). The four MANYMATRIX_HOSTED_* values are
# Gitea Actions repo secrets, see ~/dev/hetzner README section 8 for where the
# underlying secrets live and how to rotate them.
on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MANYMATRIX_HOSTED_SYNAPSE_URL: ${{ secrets.MANYMATRIX_HOSTED_SYNAPSE_URL }}
  MANYMATRIX_HOSTED_SYNAPSE_REGISTRATION_SECRET: ${{ secrets.MANYMATRIX_HOSTED_SYNAPSE_REGISTRATION_SECRET }}
  MANYMATRIX_HOSTED_TUWUNEL_URL: ${{ secrets.MANYMATRIX_HOSTED_TUWUNEL_URL }}
  MANYMATRIX_HOSTED_TUWUNEL_REGISTRATION_TOKEN: ${{ secrets.MANYMATRIX_HOSTED_TUWUNEL_REGISTRATION_TOKEN }}

jobs:
  hosted-tier:
    name: Hosted homeserver tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Run hosted E2E suite (Synapse + Tuwunel)
        run: |
          ulimit -n 65536 || ulimit -n "$(ulimit -Hn)" || true
          ulimit -n
          bash scripts/compatibility.sh hosted

  web-e2e:
    name: Web/extension E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ManyMatrix
    steps:
      - name: Checkout ManyMatrix
        uses: actions/checkout@v4
        with:
          path: ManyMatrix
      - name: Require pinned ManyUI ref
        env:
          MANYUI_CHECKOUT_REF: ${{ vars.MANYUI_CHECKOUT_REF }}
        run: |
          if [[ ! "$MANYUI_CHECKOUT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "MANYUI_CHECKOUT_REF must be the full SHA of a pushed compatible ManyUI commit" >&2
            exit 1
          fi
      - name: Checkout sibling ManyUI dependency
        uses: actions/checkout@v4
        with:
          repository: sneurlax/manyui
          ref: ${{ vars.MANYUI_CHECKOUT_REF }}
          path: ManyUI
          token: ${{ secrets.MANYUI_CHECKOUT_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ManyMatrix -> target"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm
        run: wasm-pack build --target web --release crates/web
      - name: Assemble minimal extension
        run: bash scripts/assemble_web_e2e_extension.sh "$RUNNER_TEMP/min-extension"
      - name: Build embedded web_e2e_actor
        run: cargo build -p test-harness --bin web_e2e_actor
      - name: Install harness deps and Chrome
        run: |
          # The runner image ships with stale apt lists; --install-deps runs
          # apt-get satisfy and needs them fresh.
          apt-get update
          cd testing/web-e2e
          npm install --no-audit --no-fund
          npx puppeteer browsers install chrome --install-deps
      - name: Build complete Flutter web release
        run: scripts/build_manymatrix_web.sh
      - name: Ordinary browser Worker smoke
        run: node testing/web-e2e/ordinary_worker_smoke.mjs
      - name: Ordinary browser Matrix E2E against embedded Tuwunel
        run: node testing/web-e2e/ordinary_matrix.mjs
      - name: Full Flutter web E2E against embedded Tuwunel
        run: node testing/web-e2e/full_app.mjs
      - name: Extension E2E against embedded Tuwunel
        run: EXTENSION_DIR="$RUNNER_TEMP/min-extension" node testing/web-e2e/run.mjs embedded
      - name: Build hosted web_e2e_actor
        run: cargo build -p test-harness --bin web_e2e_actor --no-default-features --features hosted-tests
      - name: Web E2E against hosted Synapse
        run: EXTENSION_DIR="$RUNNER_TEMP/min-extension" node testing/web-e2e/run.mjs hosted-synapse
      - name: Web E2E against hosted Tuwunel
        run: EXTENSION_DIR="$RUNNER_TEMP/min-extension" node testing/web-e2e/run.mjs hosted-tuwunel
