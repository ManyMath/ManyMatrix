name: Core CI

# Runs the fast, infra-free verification gates (no Docker, no hosted
# homeservers) on every push and PR against main or dev: cargo check across the
# native workspace, the wasm target check + build for manymatrix-web, the
# default embedded-Tuwunel test suite, and Flutter analysis/tests for the
# plugin and ManyMatrix app. Complements
# docker-compat.yml (Docker-tier homeservers) and hosted-e2e.yml (permanently
# hosted homeservers + web/extension E2E), which cover slower, infra-backed
# tiers on push to main and dev only.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  native-check:
    name: cargo check + test (native workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Install libclang (bindgen/zstd-sys build dependency, e.g. via RocksDB)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: cargo check --workspace --exclude manymatrix-web
        run: cargo check --workspace --exclude manymatrix-web
      - name: cargo test --workspace --exclude manymatrix-web (default embedded tier)
        run: |
          ulimit -n 65536 || ulimit -n "$(ulimit -Hn)" || true
          ulimit -n
          cargo test --workspace --exclude manymatrix-web
      - name: scripts/verify_git_dependency.sh (PUB-01 consumption path)
        run: bash scripts/verify_git_dependency.sh

  wasm-check:
    name: cargo check + wasm-pack build (manymatrix-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check -p manymatrix-web --target wasm32-unknown-unknown
        run: cargo check -p manymatrix-web --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: wasm-pack build --target web --release crates/web
        run: wasm-pack build --target web --release crates/web
      - name: Browser Worker protocol tests
        run: node --test apps/ManyMatrix/test_web/*.mjs

  flutter-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ManyMatrix
        uses: actions/checkout@v4
        with:
          path: ManyMatrix
      - name: Checkout sibling ManyUI dependency
        uses: actions/checkout@v4
        with:
          repository: sneurlax/manyui
          ref: 7d0fc083eff35c2b5c035d4328f5ed2d6845ced2
          path: ManyUI
          token: ${{ secrets.MANYUI_CHECKOUT_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test Flutter plugin
        working-directory: ManyMatrix/flutter_plugin
        run: |
          flutter analyze
          flutter test
      - name: Analyze and test ManyMatrix app
        working-directory: ManyMatrix/apps/ManyMatrix
        run: |
          flutter analyze
          flutter test
